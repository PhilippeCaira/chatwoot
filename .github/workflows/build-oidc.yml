name: Build & push OIDC image

on:
  push:
    branches: [oidc]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/chatwoot-oidc
  UPSTREAM: chatwoot/chatwoot

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: oidc
          fetch-depth: 0

      - name: Sync with upstream
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/${{ env.UPSTREAM }}.git || true
          # Chatwoot utilise des branches release/X.Y.Z, on sync avec la dernière
          LATEST_TAG=$(git ls-remote --tags upstream 'refs/tags/v*' | tail -1 | sed 's/.*refs\/tags\///')
          git fetch upstream "$LATEST_TAG"
          if git rebase "FETCH_HEAD"; then
            git push origin oidc --force-with-lease
          else
            git rebase --abort
            echo "::warning::Rebase failed — manual intervention needed"
          fi

      - name: Detect version
        id: version
        run: |
          # Version depuis le dernier tag chatwoot
          VERSION=$(grep 'CHATWOOT_VERSION' config/app.yml 2>/dev/null | grep -oP "'[^']+'" | tr -d "'" || echo "v4.12.0")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.oidc
          target: chatwoot-oidc
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
